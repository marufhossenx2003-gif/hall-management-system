<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hall Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="nav-overlay" class="nav-overlay" onclick="closeNavDrawer()"></div>
  <aside id="left-drawer" class="left-drawer">
    <div class="drawer-header">
      <h3>🧭 Navigation</h3>
      <button class="drawer-close" onclick="closeNavDrawer()">&times;</button>
    </div>
    <nav class="drawer-links">
      <a href="index.html" class="active">🏠 Rooms & Beds</a>
      <a href="meal.html">🍽️ Meal System</a>
      <a href="meal-cost.html">🧾 Meal Total Cost</a>
      <a href="meal-graph.html">📈 Meal Graph</a>
      <a href="javascript:void(0)" onclick="goToAdminPage()">⚙️ Admin Panel</a>
      <a href="javascript:void(0)" onclick="goToMealManagerPage()">👨‍🍳 Meal Manager</a>
    </nav>
  </aside>

  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="openNavDrawer()">☰ Menu</button>
      <h1>🏛️ Hall Management System</h1>
    </div>
    <button id="admin-btn" onclick="goToAdminPage()">Admin Panel 🔒</button>
  </header>

  <div class="container">
    <section class="search-section">
      <h2>🔍 Search Student</h2>
      <input type="text" id="search-input" onkeyup="searchStudent()" placeholder="Search by Name, ID, Department, Phone or District...">
      <div id="search-results"></div>
    </section>

    <hr>

    <section class="room-section">
      <h2>🏢 Hall Rooms & Beds</h2>
      <div id="room-list" class="room-grid"></div>
    </section>
  </div>

  <div id="info-modal" class="modal">
    <div class="modal-content" style="max-width: 550px;">
      <span class="close-btn" onclick="closeInfoModal()">&times;</span>
      <h2>👤 Student Information</h2>
      <div id="student-details-container" style="display: flex; gap: 20px; align-items: center; margin-top: 15px; text-align: left;">
        <div id="student-details" style="flex: 1;"></div>
        <div id="student-image-box" style="width: 130px; text-align: center;">
          <img id="st-profile-pic" src="" alt="Student Photo" style="width: 120px; height: 140px; object-fit: cover; border-radius: 8px; border: 2px solid #cbd5e1;">
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
